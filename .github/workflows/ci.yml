name: CI

on:
  push:
  pull_request:

# Explicit bash so pipelines use pipefail (the implicit default shell does
# not, which lets `make ... | tee` hide a failing make).
defaults:
  run:
    shell: bash

jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Synthesis uses a pinned Yosys (the exact release the committed results
      # were produced with). OSS CAD Suite provides Icarus Verilog / Verilator.
      - run: pip install matplotlib pytest yowasp-yosys==0.70.0.0.post1259
      - uses: YosysHQ/setup-oss-cad-suite@v3
      - name: Tool versions
        run: |
          yowasp-yosys -V || true; (iverilog -V 2>&1 | head -n 1) || true; verilator --version || true
      - name: Download NanGate45 libraries
        run: make lib PYTHON=python
      - name: STA engine unit tests
        run: make test PYTHON=python
      - name: Lint (Verilator -Wall)
        run: make lint
      - name: RTL simulation
        run: mkdir -p build && make sim 2>&1 | tee build/step_sim.log
      - name: Synthesis + hold fix + multi-corner STA
        run: make flow PYTHON=python YOSYS=yowasp-yosys 2>&1 | tee build/step_flow.log
      - name: Synthesis diagnostics
        if: always()
        run: |
          { yowasp-yosys -V; for d in dot2_v1 dot2_v5; do
              echo "== $d"; grep -E "Warning|ERROR" build/${d}_yosys.log | sort | uniq -c | sort -rn | head -n 12
              grep -cE "DFF_X1|DFFR_X1" results/$d/${d}_netlist.v
            done; } > build/diag.log 2>&1 || true
          python scripts/ci_annotate.py --notice --lines 40 build/diag.log
      - name: Gate-level simulation
        run: make gls PYTHON=python 2>&1 | tee build/step_gls.log
      - name: Results match the committed ones
        run: git diff --stat --exit-code -- reports/summary.md "results/*/*_netlist.v"
      - name: Summary
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish key results
        run: |
          python scripts/ci_annotate.py --notice --lines 6 results/sim.log results/gls.log
          python scripts/ci_annotate.py --notice --lines 25 reports/summary.md
      - name: Report failure details
        if: failure()
        run: python scripts/ci_annotate.py build/step_*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-results
          path: |
            reports/
            results/
            build/*.log

  # Cross-check the committed netlists with OpenSTA (bundled in OpenROAD).
  # Non-blocking: the comparison table lands in the job summary; a
  # difference above the tolerance marks this job failed without failing CI.
  opensta:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download NanGate45 libraries
        run: make lib PYTHON=python
      - name: Run OpenSTA (openroad/orfs image)
        run: |
          mkdir -p build
          docker run --rm -v "$PWD:/work" -w /work openroad/orfs:latest bash -c '
            OR=$(command -v openroad || find / -name openroad -type f -perm -u+x 2>/dev/null | head -n 1)
            P=$(dirname "$(find / -path "*platforms/nangate45/lef*" -name "*tech.lef" 2>/dev/null | head -n 1)")
            export TECH_LEF=$(ls $P/*tech.lef | head -n 1)
            export MACRO_LEF=$(ls $P/*macro*.lef | head -n 1)
            echo "using openroad: $OR"; echo "TECH_LEF=$TECH_LEF"; echo "MACRO_LEF=$MACRO_LEF"
            for d in dot2_v1 dot2_v2 dot2_v3 dot2_v4 dot2_v5; do
              DESIGN=$d "$OR" -exit scripts/sta.tcl || exit 1
            done' 2>&1 | tee build/step_opensta.log
      - name: Compare with sta.py
        run: python scripts/compare_opensta.py 2>&1 | tee build/step_compare.log | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish comparison
        run: python scripts/ci_annotate.py --notice --lines 15 build/step_compare.log
      - name: Report failure details
        if: failure()
        run: python scripts/ci_annotate.py build/step_*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opensta-reports
          path: |
            reports/*_opensta.rpt
            build/*.log
